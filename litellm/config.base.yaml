# ============================================================================
#  Base LiteLLM config. The generator merges this file with the `model_list`
#  derived from models.yaml and writes the result to generated/litellm.config.yaml.
#  Keep global proxy settings here - not model definitions.
# ============================================================================

litellm_settings:
  drop_params: true          # fields the backend doesn't support are dropped instead of failing the request

  # CRITICAL for this harness.
  # LiteLLM translates /v1/messages (Anthropic format) to the provider's API, but for
  # the `openai` provider it defaults to the Responses API (POST <api_base>/responses).
  # Most OpenAI-compatible endpoints (z.ai, DeepSeek, Moonshot, vLLM, sglang)
  # only expose /chat/completions - without this flag you get 404 /responses.
  # If you add a provider that ONLY has the Responses API: set this to `false`
  # and give that model `api: openai-responses` in models.yaml.
  use_chat_completions_url_for_anthropic_messages: true
  telemetry: false
  request_timeout: 900
  num_retries: 1
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # The proxy runs only on the internal compose network, with no database and no UI.
  disable_spend_logs: true
  disable_error_logs: true

router_settings:
  routing_strategy: simple-shuffle
  allowed_fails: 2
  cooldown_time: 30
